[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
pandoc = ">=3.9,<4"
typst = ">=0.14,<1"
nodejs = ">=20,<21"

[tasks]
_mkdir = "mkdir -p build"
_fetch-grammar = { cmd = "bash docs/templates/fetch-grammar.sh", depends-on = ["_mkdir"] }
_copy-assets = { cmd = "cp docs/templates/style.css docs/templates/theme-init.js docs/templates/docs-app.js docs/templates/search-helpers.js build/ && cp docs/favicon.ico build/ 2>/dev/null || true && cp -r docs/diagrams build/ 2>/dev/null || true", depends-on = [
    "_mkdir",
    "test-js",
] }
_katex = { cmd = "node docs/templates/vendor-katex.js", depends-on = [
    "_mkdir",
] }
_fuse = { cmd = "node docs/templates/vendor-fuse.js", depends-on = ["_mkdir"] }
_pandoc-html = { cmd = "pandoc docs/0[0-9]-*.md docs/1[0-9]-*.md -o build/index.html --standalone --template=docs/templates/template.html --toc --toc-depth=2 --number-sections --shift-heading-level-by=-1 --syntax-definition=build/flatppl.xml --syntax-highlighting=tango --css=style.css --katex=./katex/ -B docs/templates/header.html --lua-filter=docs/templates/strip-file-refs.lua --lua-filter=docs/templates/html-anchors.lua --metadata lang=en", depends-on = [
    "_copy-assets",
    "_katex",
    "_fuse",
    "_fetch-grammar",
] }
_prerender-math = { cmd = "node docs/templates/prerender-katex.js", depends-on = [
    "_pandoc-html",
] }
_check-html = { cmd = "node docs/templates/check-html.js build/index.html docs", depends-on = [
    "_prerender-math",
] }
build-html = { depends-on = ["_check-html"] }
build-pdf = { cmd = "node docs/templates/check-typst.js build/flatppl-design.typ build/flatppl-design.pdf", depends-on = [
    "build-typst",
] }
build-md = { cmd = "pandoc docs/0[0-9]-*.md docs/1[0-9]-*.md -t markdown -o build/flatppl-design.md --standalone --lua-filter=docs/templates/strip-file-refs.lua --lua-filter=docs/templates/html-anchors.lua && node docs/templates/postprocess-pandoc.js md build/flatppl-design.md", depends-on = [
    "_mkdir",
] }
build-typst = { cmd = "pandoc build/flatppl-design.md -t typst -o build/flatppl-design.typ --standalone --toc --toc-depth=2 --number-sections --shift-heading-level-by=-1 --lua-filter=docs/templates/typst-code-blocks.lua --include-in-header=docs/templates/typst-header.typ && node docs/templates/postprocess-pandoc.js typst build/flatppl-design.typ", depends-on = [
    "build-md",
] }
build = { depends-on = ["build-html", "build-pdf", "build-md", "build-typst"] }
clean = "rm -rf build"
test-js = "node --test docs/templates/*.test.js"
