[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
pandoc = ">=3.9,<4"
typst = ">=0.14,<1"
nodejs = ">=20,<21"

[target.unix.dependencies]
sed = "*"

[target.win-64.dependencies]
m2-sed = "*"

[tasks]
_mkdir = "mkdir -p build"
_copy-assets = { cmd = "cp docs/templates/style.css build/ && cp docs/favicon.ico build/ 2>/dev/null || true && cp -r docs/diagrams build/ 2>/dev/null || true", depends-on = [
    "_mkdir",
] }
_katex = { cmd = "node docs/templates/vendor-katex.js", depends-on = [
    "_mkdir",
] }
_src-files = "docs/0[0-9]-*.md docs/1[0-9]-*.md"
_pandoc-html = { cmd = "pandoc docs/0[0-9]-*.md docs/1[0-9]-*.md -o build/index.html --standalone --template=docs/templates/template.html --toc --toc-depth=2 --number-sections --shift-heading-level-by=-1 --syntax-highlighting=tango --css=style.css --katex=./katex/ -B docs/templates/header.html --lua-filter=docs/templates/strip-file-refs.lua --lua-filter=docs/templates/html-anchors.lua", depends-on = [
    "_copy-assets",
    "_katex",
] }
_prerender-math = { cmd = "node docs/templates/prerender-katex.js", depends-on = [
    "_pandoc-html",
] }
build-html = { depends-on = ["_prerender-math"] }
build-pdf = { cmd = "typst compile build/flatppl-design.typ build/flatppl-design.pdf", depends-on = [
    "build-typst",
] }
build-md = { cmd = "pandoc docs/0[0-9]-*.md docs/1[0-9]-*.md -t markdown -o build/flatppl-design.md --standalone --lua-filter=docs/templates/strip-file-refs.lua --lua-filter=docs/templates/html-anchors.lua && sed -i 's/^``` /```/g' build/flatppl-design.md", depends-on = [
    "_mkdir",
] }
build-typst = { cmd = "pandoc build/flatppl-design.md -t typst -o build/flatppl-design.typ --standalone --toc --toc-depth=2 --number-sections --shift-heading-level-by=-1 --lua-filter=docs/templates/typst-code-blocks.lua --include-in-header=docs/templates/typst-header.typ && sed -i 's/times\\.circle/times.o/g' build/flatppl-design.typ && sed -i 's/\\bsect\\b/inter/g' build/flatppl-design.typ && sed -i '/^<references>$/d' build/flatppl-design.typ", depends-on = [
    "build-md",
] }
build = { depends-on = ["build-html", "build-pdf", "build-md", "build-typst"] }
clean = "rm -rf build"
