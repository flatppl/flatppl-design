name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The FlatPPL Kate/skylighting grammar lives in flatppl-grammars and is the
      # single source of truth. Fetch the current `main` copy at deploy time so the
      # published docs never drift from it (the in-repo docs/templates/flatppl.xml
      # is a convenience copy for local builds and is overwritten here).
      - name: Fetch FlatPPL syntax grammar (flatppl-grammars@main)
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/flatppl/flatppl-grammars/main/kate/flatppl.xml"
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            "$url" -o docs/templates/flatppl.xml
          grep -q '<language name="FlatPPL"' docs/templates/flatppl.xml \
            || { echo "::error::fetched flatppl.xml is not the FlatPPL Kate grammar"; exit 1; }
          echo "Fetched kate/flatppl.xml from flatppl-grammars@main ($(wc -c < docs/templates/flatppl.xml) bytes)"

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
          locked: true

      # Cache the vendored web assets (KaTeX dist + Fuse bundle); keyed on the
      # vendor scripts (which pin the versions). On a hit the vendor steps no-op.
      - name: Cache vendored web assets (KaTeX, Fuse)
        uses: actions/cache@v5
        with:
          path: |
            build/katex
            build/fuse.min.js
            build/.fuse-version
          key: vendor-assets-${{ hashFiles('docs/templates/vendor-katex.js', 'docs/templates/vendor-fuse.js') }}

      - name: Build docs
        run: pixi run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
