name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      # Cache the vendored web assets (KaTeX dist + Fuse bundle); keyed on the
      # vendor scripts (which pin the versions). On a hit the vendor steps no-op.
      - name: Cache vendored web assets (KaTeX, Fuse)
        uses: actions/cache@v5
        with:
          path: |
            build/katex
            build/fuse.min.js
            build/.fuse-version
          key: vendor-assets-${{ hashFiles('docs/templates/vendor-katex.js', 'docs/templates/vendor-fuse.js', 'package.json') }}

      - name: Build docs
        run: pixi run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
