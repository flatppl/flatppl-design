name: PR Checks

# Builds the docs and runs the cross-reference / anchor / math validators
# (check-html.js, check-typst.js, run as part of `pixi run build`) on every
# pull request, so the build output can be inspected on each PR. This is
# informational and does not block merging; to gate merges, mark the `build`
# job as a required status check in the branch protection rules for `main`.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      # Cache the vendored web assets (KaTeX dist + the Fuse bundle). They are
      # pinned in the vendor scripts, so key on those scripts; a version bump
      # edits the script, changes the key, and rebuilds. On a hit the vendor
      # steps no-op (their version stamps match), skipping the npm installs.
      - name: Cache vendored web assets (KaTeX, Fuse)
        uses: actions/cache@v5
        with:
          path: |
            build/katex
            build/fuse.min.js
            build/.fuse-version
          key: vendor-assets-${{ hashFiles('docs/templates/vendor-katex.js', 'docs/templates/vendor-fuse.js', 'package.json') }}

      - name: Build docs and run validators
        run: pixi run build

      # Publish the rendered docs so reviewers can download and inspect the
      # output (HTML + PDF) for the PR. Runs even if the build/validators fail.
      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: build/
          if-no-files-found: ignore
